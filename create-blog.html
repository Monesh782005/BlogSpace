<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlogSpace - Create Blog</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>

        <nav class="navbar">

            <div class="logo">
                <a href="index.html">BlogSpace</a>
            </div>

            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="dashboard.html">Dashboard</a>
                </li>

                <li>
                    <a href="create-blog.html">Create Blog</a>
                </li>

               <li>
    <a href="#" onclick="logout()">Logout</a>
</li>
            </ul>

        </nav>

    </header>


    <main>

        <section class="form-section">

            <div class="form-container blog-form">

                <h1 id="blogFormTitle">Create New Blog</h1>
                <p>
                    Share your thoughts with the BlogSpace community.
                </p>


                <form id="blogForm">

                    <div class="form-group">

                        <label for="blogTitle">
                            Blog Title
                        </label>

                        <input
                            type="text"
                            id="blogTitle"
                            placeholder="Enter your blog title"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="blogCategory">
                            Category
                        </label>

                        <select id="blogCategory" required>

                            <option value="">
                                Select a category
                            </option>

                            <option value="Technology">
                                Technology
                            </option>

                            <option value="Programming">
                                Programming
                            </option>

                            <option value="Lifestyle">
                                Lifestyle
                            </option>

                            <option value="Education">
                                Education
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="blogContent">
                            Blog Content
                        </label>

                        <textarea
                            id="blogContent"
                            rows="10"
                            placeholder="Write your blog here..."
                            required
                        ></textarea>

                    </div>


                    <div class="form-actions">

                        <button
    type="submit"
    class="btn"
    id="blogSubmitButton"
>
    Publish Blog
</button>

                        <a
                            href="dashboard.html"
                            class="btn secondary-btn"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 BlogSpace. All rights reserved.
        </p>

    </footer>
   <script src="js/script.js"></script>
</body>
</html>
